<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO — overridden per page by react-helmet-async -->
    <title>Government Tender Consultancy & GeM Support | Prayash Consultancy</title>
    <meta
      name="description"
      content="Practical assistance with government tenders — GeM registration, tender discovery, eligibility checks, bid documentation and submission support. Talk to a tender expert."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prayash Consultancy" />
    <meta property="og:title" content="Government Tender Consultancy & GeM Support | Prayash Consultancy" />
    <meta
      property="og:description"
      content="From GeM registration and tender discovery to bid preparation and submission support — practical assistance from a dedicated tender team."
    />
    <meta property="og:url" content="https://prayashconsultancy.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Government Tender Consultancy & GeM Support | Prayash Consultancy" />
    <meta
      name="twitter:description"
      content="From GeM registration and tender discovery to bid preparation and submission support — practical assistance from a dedicated tender team."
    />

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#080E1D" />
  </head>
  <body>
    <!-- Netlify Forms static detection for SPA build -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="companyName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="requirementType" />
      <input type="text" name="tenderNumber" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="tender-review" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="companyName" />
      <input type="tel" name="mobile" />
      <input type="email" name="email" />
      <input type="text" name="tenderNumber" />
      <input type="text" name="tenderAuthority" />
      <textarea name="message"></textarea>
      <input type="text" name="preferredContact" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
